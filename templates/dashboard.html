<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insider Threat Monitoring</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4"><div class="container">
  <span class="navbar-brand mb-0 h1">Insider Threat Monitoring &amp; User Behavior Analysis</span>
</div></nav>
<div class="container">
  <div class="row g-4">
    <div class="col-lg-6"><div class="card shadow-sm"><div class="card-body">
      <h5 class="card-title">Risk Score per User</h5><canvas id="riskChart"></canvas>
    </div></div></div>
    <div class="col-lg-6"><div class="card shadow-sm"><div class="card-body">
      <h5 class="card-title">Event Distribution</h5><canvas id="eventChart"></canvas>
    </div></div></div>
    <div class="col-12"><div class="card shadow-sm"><div class="card-body">
      <h5 class="card-title">User Risk Summary</h5>
      <table class="table table-sm" id="userTable">
        <thead><tr><th>User</th><th>Events</th><th>Risk Score</th><th>Level</th></tr></thead><tbody></tbody>
      </table>
    </div></div></div>
    <div class="col-12 mb-4"><div class="card shadow-sm"><div class="card-body">
      <h5 class="card-title">Recent Events</h5>
      <table class="table table-sm" id="recentTable">
        <thead><tr><th>Time</th><th>Host</th><th>User</th><th>Event</th><th>Source</th></tr></thead><tbody></tbody>
      </table>
    </div></div></div>
  </div>
</div>
<script>
const COLORS = {Low: "success", Medium: "warning", High: "danger", Critical: "dark"};
const RGB = {Low: "#198754", Medium: "#ffc107", High: "#dc3545", Critical: "#212529"};

fetch("/api/users").then(r => r.json()).then(users => {
  new Chart(document.getElementById("riskChart"), {
    type: "bar",
    data: {labels: users.map(u => u.user),
           datasets: [{label: "Risk score", data: users.map(u => u.risk_score),
                       backgroundColor: users.map(u => RGB[u.level])}]},
    options: {plugins: {legend: {display: false}}}
  });
  document.querySelector("#userTable tbody").innerHTML = users.map(u =>
    `<tr><td>${u.user}</td><td>${u.events}</td><td>${u.risk_score}</td>
     <td><span class="badge text-bg-${COLORS[u.level]}">${u.level}</span></td></tr>`).join("");
});

fetch("/api/events").then(r => r.json()).then(ev => {
  new Chart(document.getElementById("eventChart"), {
    type: "doughnut",
    data: {labels: Object.keys(ev), datasets: [{data: Object.values(ev)}]}
  });
});

fetch("/api/recent").then(r => r.json()).then(rows => {
  document.querySelector("#recentTable tbody").innerHTML = rows.map(r =>
    `<tr><td>${r.ts}</td><td>${r.host}</td><td>${r.user}</td><td>${r.event}</td><td>${r.src}</td></tr>`).join("");
});
</script>
</body>
</html>
